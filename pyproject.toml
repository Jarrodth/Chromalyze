[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromalyze"
version = "0.1.0"
description = "Standalone audio analysis engine: tempo, beats, key, chords, and scale from a raw audio file."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jarrod Thompson" }]
dependencies = [
    "librosa>=0.10",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
